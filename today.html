<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List - Today</title>
<script defer src="bundle.js"></script></head>
<body>
  <header>
    <div class="header-logo">Todo List</div>
  </header>
  <main>
    <div class="nav-section">
      <nav>
        <a href="index.html">Inbox</a>
        <a href="today.html" class="active">Today</a>
        <a href="this-week.html">This week</a>
        <a href="this-month.html">This month</a>
        <a href="this-quarter.html">This quarter</a>
        <a href="this-year.html">This year</a>
      </nav>
      <div class="nav-projects">
        <div class="projects-txt">Projects:</div>
        <div id="projectsWrapper"></div>
        <button data-add-form class="add-project-btn">+ Add Project</button>
        <form class="add-project-form">
          <input type="text" id="projectTitle" class="project-title" placeholder="Title">
          <input type="button" data-add class="project-add" value="Add">
          <input type="button" data-close class="project-close" value="Close">
        </form>
      </div>
    </div>
    <div class="tasks-display">
      <div id="tasksWrapper"></div>
      <button data-add-form class="add-task-btn">+ Add Task</button>
      <form class="add-task-form">
        <input type="text" id="taskTitle" class="task-title" placeholder="Title">
        <div class="priority-txt">Select priority:</div>
        <input type="radio" id="low" class="low-pr" name="priority" value="Low">
        <label for="low" class="low-label">Low</label>
        <input type="radio" id="medium" class="medium-pr" name="priority" value="Medium">
        <label for="medium" class="medium-label">Medium</label>
        <input type="radio" id="high" class="high-pr" name="priority" value="High">
        <label for="high" class="high-label">High</label>
        <input type="date" class="date-picker" id="dueDate" value="dd-mm-yyyy">
        <input type="button" data-add class="form-add" value="Add">
        <input type="button" data-close class="form-close" value="Close">
      </form>
    </div>
  </main>
  <footer>
    <div class="footer-info">
        <div class="footer-txt">Developed by YasenYanev</div>
        <a href="https://github.com/YasenYanev" aria-label="GitHub profile">
          <img id="footer-icon" class="gitLogo" src="" alt="GitHub" width="24" height="24">
        </a>
    </div>
  </footer>
</body>
</html>
